<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVC Student ID Card Studio - Maharishi Vidya Mandir</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="stylesheet" href="/css/styles.css">
  <style>
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .no-print { display: none !important; }
      .badge-sheet-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 20px !important; margin: 0 auto !important; }
      .student-pvc-card {
        background: #ffffff !important;
        border: 2px solid #0f172a !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        width: 320px !important;
        height: 480px !important;
        margin: 10px auto !important;
      }
      .badge-text-white { color: #0f172a !important; }
      .badge-text-gray { color: #475569 !important; }
      .badge-bg-subtle { background: #f1f5f9 !important; border-color: #cbd5e1 !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#070a13] text-gray-100 p-6 sm:p-10">

  <!-- Control Header (Hidden on Print) -->
  <div class="no-print max-w-6xl mx-auto mb-8 bg-slate-900 border border-white/10 rounded-3xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-2xl">
    <div>
      <h1 class="text-xl font-bold text-white flex items-center gap-2">
        <span class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-sm">🪪</span>
        PVC Student ID Card Studio (Batch Printing)
      </h1>
      <p class="text-xs text-gray-400 mt-1">Class-wise multi-card sheets formatted for standard CR80 physical card printers & A4 sheets</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <select id="card-class-select" class="glass-input px-3 py-2 rounded-xl text-xs">
        <option value="">All Classes</option>
      </select>

      <button onclick="window.print()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
        Print Class ID Batch
      </button>

      <a href="/" class="px-4 py-2.5 rounded-xl bg-slate-800 text-gray-300 hover:text-white text-xs font-semibold border border-white/10">
        Back to Dashboard
      </a>
    </div>
  </div>

  <!-- Cards Grid Container -->
  <div id="student-badges-container" class="badge-sheet-grid max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center">
    <!-- Populated dynamically -->
  </div>

  <script src="/js/api.js"></script>
  <script>
    let studentsList = [];
    let schoolSettings = null;

    document.addEventListener('DOMContentLoaded', async () => {
      schoolSettings = await API.getSettings();
      studentsList = await API.getStudents();
      
      const classes = await API.getClasses();
      const select = document.getElementById('card-class-select');
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.grade}-${c.section}`;
        select.appendChild(opt);
      });

      select.addEventListener('change', (e) => {
        const cId = e.target.value ? parseInt(e.target.value, 10) : null;
        const filtered = cId ? studentsList.filter(x => x.class_id === cId) : studentsList;
        renderStudentCards(filtered);
      });

      renderStudentCards(studentsList);
    });

    function renderStudentCards(list) {
      const container = document.getElementById('student-badges-container');
      container.innerHTML = '';

      list.forEach((s) => {
        const card = document.createElement('div');
        card.className = "student-pvc-card id-badge-card p-5 flex flex-col items-center justify-between text-center";
        
        card.innerHTML = `
          <!-- Header -->
          <div class="w-full flex items-center justify-between border-b border-white/10 pb-2.5">
            <div class="flex items-center gap-1.5 text-left">
              <span class="w-5 h-5 rounded bg-indigo-600 flex items-center justify-center font-bold text-white text-xs">🏫</span>
              <div>
                <div class="text-[11px] font-black text-white tracking-tight badge-text-white">${schoolSettings?.name || 'Maharishi Vidya Mandir'}</div>
                <div class="text-[8px] text-gray-400 font-mono badge-text-gray">${schoolSettings?.affiliation_board || 'CBSE'} • Guwahati, Assam</div>
              </div>
            </div>
            <span class="text-[9px] text-amber-400 font-mono font-bold">STUDENT</span>
          </div>

          <!-- Student Photo & Core Details -->
          <div class="my-2 flex flex-col items-center w-full">
            <img src="${s.photo_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" class="w-20 h-20 rounded-2xl object-cover border-2 border-indigo-500/40 shadow-xl mb-1.5" alt="">
            <h4 class="text-base font-black text-white badge-text-white">${s.student_name}</h4>
            <div class="text-xs font-bold text-indigo-400 font-mono">${s.class_grade}-${s.section} (Roll #${s.roll_no})</div>
            
            <div class="w-full grid grid-cols-2 gap-1 text-[10px] font-mono text-gray-300 badge-text-gray mt-2 pt-2 border-t border-white/5">
              <div>Adm No: <strong class="badge-text-white">${s.admission_no}</strong></div>
              <div>Blood: <strong class="text-rose-400 font-bold">${s.blood_group}</strong></div>
              <div>Parent: <strong class="badge-text-white">${s.parent_guardian_name}</strong></div>
              <div>Route: <strong class="text-amber-300">${s.bus_route_no}</strong></div>
            </div>
          </div>

          <!-- High-Density Scannable QR Code -->
          <div class="bg-white p-1.5 rounded-xl shadow-inner mb-1.5 flex items-center justify-center" id="qr-target-st-${s.id}"></div>
          
          <!-- Bottom Principal Signature Stamp -->
          <div class="w-full flex items-center justify-between border-t border-white/10 pt-2 text-[9px] font-mono text-gray-400 badge-text-gray">
            <span>Parent Ph: ${s.parent_whatsapp_phone.slice(0, 10)}...</span>
            <span class="font-bold text-white badge-text-white">Principal's Signature ✓</span>
          </div>
        `;

        container.appendChild(card);

        // Generate QR code
        setTimeout(() => {
          const qrTarget = document.getElementById(`qr-target-st-${s.id}`);
          if (qrTarget && window.QRCode) {
            new QRCode(qrTarget, {
              text: s.qr_token,
              width: 95,
              height: 95,
              colorDark: "#070b14",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.H
            });
          }
        }, 50);
      });
    }
  </script>
</body>
</html>
